<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pase y Mire - Billetera</title>
  <link rel="stylesheet" href="/public/css/styles.css">
</head>
<body>
  <main class="main-content">
    <h1>💳 Mi Billetera</h1>
    <p>Gestiona tu dinero y transacciones</p>
    
    <div class="cards">
      <div class="card">
        <div class="card-icon">💰</div>
        <h3>Saldo disponible</h3>
        <p class="number">$ 15.400</p>
      </div>
      <div class="card">
        <div class="card-icon">📈</div>
        <h3>Ingresos del mes</h3>
        <p class="number">$ 45.000</p>
      </div>
      <div class="card">
        <div class="card-icon">📉</div>
        <h3>Gastos del mes</h3>
        <p class="number">$ 29.600</p>
      </div>
    </div>

    <div style="margin-top: 24px;">
      <a href="/card.html" class="btn">Ver Tarjetas</a>
      <a href="/qr.html" class="btn" style="margin-left: 10px;">Cobrar con QR</a>
    </div>
  </main>
  
  <script src="/public/js/auth.js"></script>
  <script src="/public/js/nav.js"></script>

</html>
