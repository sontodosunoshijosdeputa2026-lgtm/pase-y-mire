<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pase y Mire - Publicidad</title>
  <link rel="stylesheet" href="/public/css/styles.css">
</head>
<body>
  <main class="main-content">
    <h1> Publicidad</h1>
    <p>Gestioná tus campañas publicitarias</p>
    
    <div class="cards">
      <div class="card">
        <div class="card-icon">📊</div>
        <h3>Campañas activas</h3>
        <p class="number">4</p>
      </div>
      <div class="card">
        <div class="card-icon">👁</div>
        <h3>Impresiones</h3>
        <p class="number">25.8K</p>
      </div>
      <div class="card">
        <div class="card-icon"></div>
        <h3>Presupuesto</h3>
        <p class="number">$ 8.500</p>
      </div>
    </div>
    
    <div style="margin-top: 24px;">
      <a href="#" class="btn">Crear nueva campaña</a>
    </div>
  </main>
  
  <script src="/public/js/auth.js"></script>
  <script src="/public/js/nav.js"></script>
</body>
</html>
