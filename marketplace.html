<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pase y Mire - Marketplace</title>
  <link rel="stylesheet" href="public/css/variables.css">
  <link rel="stylesheet" href="public/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">Pase y Mire</div>
    <div class="nav-links">
      <a href="marketplace.html" class="nav-link active">Marketplace</a>
      <a href="dashboard.html" class="nav-link">Dashboard</a>
    </div>
    <div class="nav-user">
      <span id="userName">Admin</span>
      <button id="logoutBtn" class="btn-small">Salir</button>
    </div>
  </nav>

  <main class="marketplace">
    <div class="marketplace-header">
      <div>
        <h1>Marketplace</h1>
        <p class="subtitle">Productos cerca tuyo · Espacio libre</p>
      </div>
      <button class="btn-primary btn-publish" id="btnPublish">+ Publicar</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">Todos</button>
      <button class="filter-btn" data-filter="patrocinado">Patrocinados</button>
      <button class="filter-btn" data-filter="organico">Orgánicos</button>
      <button class="filter-btn" data-filter="cerca">Cerca de mí</button>
    </div>

    <div class="products-grid" id="productsGrid"></div>
  </main>

  <!-- Modal para publicar -->
  <div class="modal-overlay" id="modalPublish">
    <div class="modal">
      <div class="modal-header">
        <h2>Publicar producto</h2>
        <button class="modal-close" id="btnCloseModal">×</button>
      </div>
      <form id="publishForm">
        <div class="input-group">
          <label for="titulo">Título</label>
          <input type="text" id="titulo" required placeholder="Ej: Tocadiscos Dual 1970">
        </div>
        <div class="input-group">
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" rows="3" required placeholder="Contá un poco sobre el producto..."></textarea>
        </div>
        <div class="input-row">
          <div class="input-group">
            <label for="precio">Precio (ARS)</label>
            <input type="number" id="precio" required min="1" placeholder="150000">
          </div>
          <div class="input-group">
            <label for="distancia">Distancia (km)</label>
            <input type="number" id="distancia" required min="0.1" step="0.1" placeholder="1.5">
          </div>
        </div>
        <div class="input-group">
          <label for="tipo">Tipo</label>
          <select id="tipo" required>
            <option value="organico">Orgánico</option>
            <option value="patrocinado">Patrocinado</option>
          </select>
        </div>
        <div class="input-group">
          <label for="vendedor">Tu usuario</label>
          <input type="text" id="vendedor" required placeholder="tu_usuario">
        </div>
        <button type="submit" class="btn-primary">Publicar ahora</button>
      </form>
    </div>
  </div>

  <script src="public/js/auth.js"></script>
  <script src="public/js/marketplace.js"></script>
</body>
  </html>
