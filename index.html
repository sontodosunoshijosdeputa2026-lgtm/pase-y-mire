<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pase y Mire API</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }
    .container {
      max-width: 600px;
      text-align: center;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #00d4ff, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status {
      background: rgba(255,255,255,0.05);
      padding: 2rem;
      border-radius: 12px;
      margin: 2rem 0;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .status h2 { margin-bottom: 1rem; }
    #result {
      font-family: monospace;
      background: #0a0a0a;
      padding: 1rem;
      border-radius: 8px;
      margin-top: 1rem;
      text-align: left;
      white-space: pre-wrap;
      font-size: 0.9rem;
    }
    .btn {
      background: linear-gradient(135deg, #00d4ff, #7c3aed);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin: 5px;
      transition: transform 0.2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .endpoints {
      text-align: left;
      margin-top: 2rem;
      padding: 1.5rem;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
    }
    .endpoints h3 { margin-bottom: 1rem; }
    .endpoint {
      background: #0a0a0a;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      margin: 0.5rem 0;
      font-family: monospace;
      font-size: 0.9rem;
    }
    .success { color: #00ff88; }
    .error { color: #ff4444; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Pase y Mire API</h1>
    <p>Backend - TradeHub Platform</p>
    
    <div class="status">
      <h2>Estado del Sistema</h2>
      <button class="btn" onclick="testAPI()">Test API</button>
      <div id="result">Presioná "Test API" para verificar</div>
    </div>
    
    <div class="endpoints">
      <h3>📡 Endpoints disponibles:</h3>
      <div class="endpoint">GET /api/test</div>
      <div class="endpoint">POST /api/auth/register</div>
      <div class="endpoint">POST /api/auth/login</div>
      <div class="endpoint">GET /api/auth/verify</div>
    </div>
  </div>

  <script>
    async function testAPI() {
      const resultEl = document.getElementById('result');
      resultEl.textContent = 'Cargando...';
      
      try {
        const response = await fetch('/api/test');
        const data = await response.json();
        
        const formatted = JSON.stringify(data, null, 2);
        
        if (data.success && data.supabase === 'Conectado') {
          resultEl.innerHTML = `<span class="success">✅ API Conectada\n\n${formatted}</span>`;
        } else {
          resultEl.innerHTML = `<span class="error">⚠️ API funcionando\n\n${formatted}</span>`;
        }
      } catch (error) {
        resultEl.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
      }
    }
    
    // Auto-test al cargar
    window.addEventListener('load', testAPI);
  </script>
</body>
</html>
