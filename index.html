<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pase y Mire</title>
  <meta name="theme-color" content="#d9c7f5">  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">  <style>
    :root {
      --lavanda: #cdb8f2;
      --lavanda-oscuro: #8f72c9;
      --rosa: #f3d6e4;
      --celeste: #d7ecf7;
      --crema: #fffaf4;
      --texto: #34313b;
      --gris: #77727e;
      --blanco: #ffffff;
      --borde: #eee7f3;
      --sombra: 0 15px 45px rgba(80, 60, 100, .10);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--texto);
      background:
        radial-gradient(circle at top left, var(--rosa), transparent 35%),
        radial-gradient(circle at bottom right, var(--celeste), transparent 35%),
        var(--crema);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 460px;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 82px;
      height: 82px;
      margin: 0 auto 14px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #d9c7f5, #f3d6e4);
      color: #7658ad;
      font-size: 25px;
      font-weight: 900;
      box-shadow: var(--sombra);
    }

    .brand h1 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -.7px;
    }

    .brand p {
      margin-top: 6px;
      color: var(--gris);
      font-size: 14px;
    }

    .card {
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 28px;
      padding: 26px;
      box-shadow: var(--sombra);
      backdrop-filter: blur(12px);
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 5px;
      background: #f6f1fa;
      border-radius: 14px;
      margin-bottom: 22px;
    }

    .tab {
      border: 0;
      padding: 11px;
      border-radius: 10px;
      background: transparent;
      color: var(--gris);
      font-weight: 700;
      cursor: pointer;
    }

    .tab.active {
      background: white;
      color: var(--lavanda-oscuro);
      box-shadow: 0 4px 12px rgba(80,60,100,.08);
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    .field input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid var(--borde);
      border-radius: 14px;
      outline: none;
      background: #fff;
      font-size: 15px;
    }

    .field input:focus {
      border-color: var(--lavanda-oscuro);
      box-shadow: 0 0 0 3px rgba(143,114,201,.12);
    }

    .submit {
      width: 100%;
      border: 0;
      border-radius: 15px;
      padding: 15px;
      margin-top: 8px;
      background: linear-gradient(135deg, var(--lavanda-oscuro), #a88bd8);
      color: white;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .message {
      min-height: 22px;
      margin-top: 14px;
      text-align: center;
      font-size: 13px;
      color: #c44d67;
    }

    .guest {
      margin-top: 18px;
      text-align: center;
    }

    .guest button {
      border: 0;
      background: transparent;
      color: var(--lavanda-oscuro);
      font-weight: 700;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }
  </style></head><body><main class="app">  <section class="brand">
    <div class="logo">PyM</div>
    <h1>Pase y Mire</h1>
    <p>El espacio más libre</p>
  </section>  <section class="card"><div class="tabs">
  <button id="loginTab" class="tab active" type="button">
    Iniciar sesión
  </button>

  <button id="registerTab" class="tab" type="button">
    Registrarme
  </button>
</div>

<form id="loginForm">

  <div class="field">
    <label>Email</label>
    <input id="loginEmail"
           type="email"
           autocomplete="email"
           required>
  </div>

  <div class="field">
    <label>Contraseña</label>
    <input id="loginPassword"
           type="password"
           autocomplete="current-password"
           required>
  </div>

  <button class="submit" type="submit">
    Entrar a Pase y Mire
  </button>

</form>

<form id="registerForm" class="hidden">

  <div class="field">
    <label>Nombre</label>
    <input id="registerName"
           type="text"
           required>
  </div>

  <div class="field">
    <label>Email</label>
    <input id="registerEmail"
           type="email"
           required>
  </div>

  <div class="field">
    <label>Teléfono</label>
    <input id="registerPhone"
           type="tel">
  </div>

  <div class="field">
    <label>Documento</label>
    <input id="registerId"
           type="text">
  </div>

  <div class="field">
    <label>Contraseña</label>
    <input id="registerPassword"
           type="password"
           minlength="6"
           required>
  </div>

  <button class="submit" type="submit">
    Crear mi cuenta
  </button>

</form>

<div id="message" class="message"></div>

<div class="guest">
  <button type="button" onclick="enterMarketplace()">
    Continuar viendo productos
  </button>
</div>

  </section></main><script>
  const loginTab = document.getElementById("loginTab");
  const registerTab = document.getElementById("registerTab");
  const loginForm = document.getElementById("loginForm");
  const registerForm = document.getElementById("registerForm");
  const message = document.getElementById("message");

  function showMessage(text, error = true) {
    message.textContent = text;
    message.style.color = error ? "#c44d67" : "#5a9270";
  }

  loginTab.onclick = () => {
    loginTab.classList.add("active");
    registerTab.classList.remove("active");
    loginForm.classList.remove("hidden");
    registerForm.classList.add("hidden");
    showMessage("");
  };

  registerTab.onclick = () => {
    registerTab.classList.add("active");
    loginTab.classList.remove("active");
    registerForm.classList.remove("hidden");
    loginForm.classList.add("hidden");
    showMessage("");
  };

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    showMessage("Ingresando...", false);

    try {
      const response = await fetch("/api/auth/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          email: document.getElementById("loginEmail").value,
          password: document.getElementById("loginPassword").value
        })
      });

      const data = await response.json();

      if (!response.ok || !data.success) {
        throw new Error(data.error || "No se pudo iniciar sesión");
      }

      localStorage.setItem("token", data.token);
      localStorage.setItem("user", JSON.stringify(data.user));

      window.location.href = "/marketplace.html";

    } catch (error) {
      showMessage(error.message);
    }
  });

  registerForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    showMessage("Creando cuenta...", false);

    try {
      const response = await fetch("/api/auth/register", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          name: document.getElementById("registerName").value,
          email: document.getElementById("registerEmail").value,
          phone: document.getElementById("registerPhone").value,
          idNumber: document.getElementById("registerId").value,
          password: document.getElementById("registerPassword").value
        })
      });

      const data = await response.json();

      if (!response.ok || !data.success) {
        throw new Error(data.error || "No se pudo crear la cuenta");
      }

      localStorage.setItem("token", data.token);
      localStorage.setItem("user", JSON.stringify(data.user));

      window.location.href = "/marketplace.html";

    } catch (error) {
      showMessage(error.message);
    }
  });

  function enterMarketplace() {
    window.location.href = "/marketplace.html";
  }

  // Si ya existe una sesión, entrar directamente.
  if (localStorage.getItem("token")) {
    window.location.href = "/marketplace.html";
  }
</script></body>
  </html>
