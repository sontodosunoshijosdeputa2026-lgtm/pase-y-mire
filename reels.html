<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PyM - Reels</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            color: white;
            overflow: hidden;
            height: 100vh;
        }

        /* ===== REELS CONTAINER ===== */
        .reels-container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        .reels-container::-webkit-scrollbar {
            display: none;
        }

        .reel {
            height: 100vh;
            width: 100vw;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .reel-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .reel-gradient {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.3) 0%,
                transparent 30%,
                transparent 70%,
                rgba(0,0,0,0.7) 100%
            );
        }

        /* ===== HEADER REELS ===== */
        .reels-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
        }

        .reels-logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .reels-logo-badge {
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 0.9rem;
        }

        .reels-logo-text {
            font-weight: 800;
            font-size: 1.1rem;
        }

        .reels-tabs {
            display: flex;
            gap: 1.5rem;
        }

        .reels-tab {
            color: rgba(255,255,255,0.6);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            padding-bottom: 0.25rem;
        }

        .reels-tab.active {
            color: white;
            border-bottom: 2px solid white;
        }

        /* ===== SIDE ACTIONS ===== */
        .reel-actions {
            position: absolute;
            right: 15px;
            bottom: 100px;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            z-index: 50;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
            cursor: pointer;
        }

        .action-icon {
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            transition: all 0.3s;
        }

        .action-icon:active {
            transform: scale(0.9);
            background: rgba(255,255,255,0.3);
        }

        .action-icon.liked {
            background: #ef4444;
            color: white;
        }

        .action-count {
            font-size: 0.75rem;
            font-weight: 600;
        }

        .reel-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            border: 3px solid white;
            position: relative;
        }

        .reel-avatar .follow-badge {
            position: absolute;
            bottom: -5px;
            width: 20px;
            height: 20px;
            background: #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
        }

        /* ===== REEL INFO ===== */
        .reel-info {
            position: absolute;
            bottom: 80px;
            left: 15px;
            right: 80px;
            z-index: 50;
        }

        .reel-user {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .reel-username {
            font-weight: 700;
            font-size: 1rem;
        }

        .verified-badge {
            color: #60a5fa;
            font-size: 0.85rem;
        }

        .follow-btn {
            background: transparent;
            border: 1.5px solid white;
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .reel-description {
            font-size: 0.9rem;
            line-height: 1.4;
            margin-bottom: 0.5rem;
        }

        .reel-music {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
        }

        .reel-music i {
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 0.75rem 0;
            z-index: 100;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.2rem;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            font-size: 0.7rem;
        }

        .nav-item.active {
            color: white;
        }

        .nav-item i {
            font-size: 1.3rem;
        }

        /* ===== LOADING ===== */
        .reel-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* ===== DOUBLE TAP HEART ===== */
        .double-tap-heart {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 6rem;
            color: #ef4444;
            pointer-events: none;
            z-index: 200;
        }

        .double-tap-heart.show {
            animation: heartBurst 1s ease-out;
        }

        @keyframes heartBurst {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="reels-header">
        <div class="reels-logo">
            <div class="reels-logo-badge">PyM</div>
            <span class="reels-logo-text">Pase y Mire</span>
        </div>
        <div class="reels-tabs">
            <div class="reels-tab">Siguiendo</div>
            <div class="reels-tab active">Para ti</div>
        </div>
    </div>

    <!-- Reels Container -->
    <div class="reels-container" id="reelsContainer">
        <!-- Los reels se generan con JS -->
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <div class="nav-item" onclick="window.location.href='/marketplace.html'">
            <i class="fas fa-home"></i>
            <span>Inicio</span>
        </div>
        <div class="nav-item">
            <i class="fas fa-search"></i>
            <span>Buscar</span>
        </div>
        <div class="nav-item active">
            <i class="fas fa-play-circle"></i>
            <span>Reels</span>
        </div>
        <div class="nav-item">
            <i class="fas fa-comment-dots"></i>
            <span>Chat</span>
        </div>
        <div class="nav-item">
            <i class="fas fa-user"></i>
            <span>Perfil</span>
        </div>
    </nav>

    <script>
        // Datos de ejemplo - Reels
        const reelsData = [
            {
                id: 1,
                user: 'juan_perez',
                avatar: 'J',
                verified: true,
                description: ' iPhone 15 Pro Max a la venta! Estado impecable. #tech #apple',
                music: ' Original Sound - Juan Pérez',
                likes: 1243,
                comments: 89,
                shares: 34,
                gradient: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                icon: 'fa-mobile-alt'
            },
            {
                id: 2,
                user: 'maria_garage',
                avatar: 'M',
                verified: false,
                description: '🚗 Toyota Corolla 2020 - Único dueño, 45.000km. ¡Consultá!',
                music: '♫ Driving Free - Music',
                likes: 567,
                comments: 23,
                shares: 12,
                gradient: 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
                icon: 'fa-car'
            },
            {
                id: 3,
                user: 'carlos_realty',
                avatar: 'C',
                verified: true,
                description: '🏠 Departamento 2amb en Palermo. Vista increíble. $85.000 USD',
                music: ' City Lights - Ambient',
                likes: 2341,
                comments: 156,
                shares: 78,
                gradient: 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
                icon: 'fa-home'
            },
            {
                id: 4,
                user: 'ana_fashion',
                avatar: 'A',
                verified: false,
                description: '👗 Nueva colección de verano. Envíos a todo el país!',
                music: '♫ Summer Vibes - Pop',
                likes: 892,
                comments: 45,
                shares: 23,
                gradient: 'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
                icon: 'fa-tshirt'
            },
            {
                id: 5,
                user: 'pym_logistics',
                avatar: 'P',
                verified: true,
                description: '🚚 Servicio de logística PyM. Entregas en 24hs. ¡Contratá ahora!',
                music: '♫ PyM Official Sound',
                likes: 445,
                comments: 67,
                shares: 89,
                gradient: 'linear-gradient(135deg, #30cfd0 0%, #330867 100%)',
                icon: 'fa-truck'
            }
        ];

        // Generar reels
        const container = document.getElementById('reelsContainer');
        
        reelsData.forEach(reel => {
            const reelEl = document.createElement('div');
            reelEl.className = 'reel';
            reelEl.dataset.id = reel.id;
            
            reelEl.innerHTML = `
                <div class="reel-video" style="background: ${reel.gradient};">
                    <i class="fas ${reel.icon}" style="font-size: 8rem; opacity: 0.3;"></i>
                </div>
                <div class="reel-gradient"></div>
                
                <div class="double-tap-heart" id="heart-${reel.id}">
                    <i class="fas fa-heart"></i>
                </div>
                
                <div class="reel-actions">
                    <div class="action-btn">
                        <div class="reel-avatar">
                            ${reel.avatar}
                            <div class="follow-badge"><i class="fas fa-plus"></i></div>
                        </div>
                    </div>
                    <div class="action-btn" onclick="toggleLike(${reel.id})">
                        <div class="action-icon" id="like-icon-${reel.id}">
                            <i class="fas fa-heart"></i>
                        </div>
                        <span class="action-count" id="like-count-${reel.id}">${formatNumber(reel.likes)}</span>
                    </div>
                    <div class="action-btn">
                        <div class="action-icon">
                            <i class="fas fa-comment-dots"></i>
                        </div>
                        <span class="action-count">${formatNumber(reel.comments)}</span>
                    </div>
                    <div class="action-btn">
                        <div class="action-icon">
                            <i class="fas fa-share"></i>
                        </div>
                        <span class="action-count">${formatNumber(reel.shares)}</span>
                    </div>
                    <div class="action-btn">
                        <div class="action-icon">
                            <i class="fas fa-ellipsis-h"></i>
                        </div>
                    </div>
                </div>
                
                <div class="reel-info">
                    <div class="reel-user">
                        <span class="reel-username">@${reel.user}</span>
                        ${reel.verified ? '<i class="fas fa-check-circle verified-badge"></i>' : ''}
                        <button class="follow-btn">Seguir</button>
                    </div>
                    <p class="reel-description">${reel.description}</p>
                    <div class="reel-music">
                        <i class="fas fa-music"></i>
                        <span>${reel.music}</span>
                    </div>
                </div>
            `;
            
            // Double tap para like
            let lastTap = 0;
            reelEl.addEventListener('touchend', (e) => {
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTap;
                if (tapLength < 300 && tapLength > 0) {
                    showDoubleTapHeart(reel.id);
                    toggleLike(reel.id, true);
                }
                lastTap = currentTime;
            });
            
            container.appendChild(reelEl);
        });

        function formatNumber(num) {
            if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
            return num;
        }

        function toggleLike(id, forceLike = false) {
            const icon = document.getElementById(`like-icon-${id}`);
            const count = document.getElementById(`like-count-${id}`);
            
            if (forceLike || !icon.classList.contains('liked')) {
                icon.classList.add('liked');
                const current = parseInt(count.textContent.replace('k', '000'));
                count.textContent = formatNumber(current + 1);
            } else {
                icon.classList.remove('liked');
            }
        }

        function showDoubleTapHeart(id) {
            const heart = document.getElementById(`heart-${id}`);
            heart.classList.remove('show');
            void heart.offsetWidth; // Reset animation
            heart.classList.add('show');
            setTimeout(() => heart.classList.remove('show'), 1000);
        }

        // Tabs
        document.querySelectorAll('.reels-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.reels-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // Follow buttons
        document.querySelectorAll('.follow-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                if (this.textContent === 'Seguir') {
                    this.textContent = 'Siguiendo';
                    this.style.background = 'white';
                    this.style.color = 'black';
                } else {
                    this.textContent = 'Seguir';
                    this.style.background = 'transparent';
                    this.style.color = 'white';
                }
            });
        });
    </script>
</body>
  </html>
