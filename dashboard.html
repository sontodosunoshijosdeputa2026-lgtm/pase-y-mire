<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pase y Mire - Dashboard</title>
  <link rel="stylesheet" href="public/css/variables.css">
  <link rel="stylesheet" href="public/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">Pase y Mire</div>
    <div class="nav-user">
      <span id="userName">Admin</span>
      <button id="logoutBtn" class="btn-small">Salir</button>
    </div>
  </nav>

  <main class="dashboard">
    <div class="dashboard-header">
      <h2>Panel de control</h2>
      <p class="welcome" id="mensaje">Cargando...</p>
    </div>

    <div class="cards">
      <div class="card">
        <div class="card-icon">👁</div>
        <h3>Visitas</h3>
        <p class="number" id="visitas">—</p>
      </div>
      <div class="card">
        <div class="card-icon">👥</div>
        <h3>Usuarios</h3>
        <p class="number" id="usuarios">—</p>
      </div>
      <div class="card">
        <div class="card-icon">📦</div>
        <h3>Publicaciones</h3>
        <p class="number" id="posts">—</p>
      </div>
    </div>

    <div class="quick-actions">
      <h3>Acciones rápidas</h3>
      <div class="actions-grid">
        <a href="#" class="action-btn">Ver Marketplace</a>
        <a href="#" class="action-btn">Modo Chofer</a>
        <a href="#" class="action-btn">Publicar producto</a>
      </div>
    </div>
  </main>

  <script src="public/js/auth.js"></script>
  <script src="public/js/app.js"></script>
</body>
</html>
